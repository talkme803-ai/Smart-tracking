<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Tracks - Professional Shipping Intelligence</title>
    <script src="https://js.17track.net/v5.5/js/external-call.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(59, 130, 246, 0.2),
                0 0 60px rgba(59, 130, 246, 0.3);
            overflow: hidden;
            animation: glowPulse 3s ease-in-out infinite alternate;
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(59, 130, 246, 0.2), 0 0 60px rgba(59, 130, 246, 0.3); }
            100% { box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(59, 130, 246, 0.4), 0 0 80px rgba(59, 130, 246, 0.5); }
        }

        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            padding: 30px;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            text-shadow: 0 4px 20px rgba(255, 255, 255, 0.3);
        }

        .tagline {
            font-size: 1.1rem;
            opacity: 0.9;
            font-weight: 500;
        }

        .main-content {
            padding: 40px;
        }

        .input-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .tracking-input {
            flex: 1;
            min-width: 250px;
            padding: 18px 24px;
            font-size: 1.1rem;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .tracking-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
            transform: translateY(-2px);
        }

        .track-btn {
            padding: 18px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.4);
            white-space: nowrap;
        }

        .track-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(59, 130, 246, 0.6);
        }

        .track-btn:active {
            transform: translateY(-1px);
        }

        .results-container {
            min-height: 400px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 30px;
            border: 2px solid rgba(59, 130, 246, 0.2);
            display: none;
        }

        .results-container.show {
            display: block;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.2rem;
            color: #3b82f6;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
            margin-left: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footer {
            background: rgba(0, 0, 0, 0.8);
            padding: 25px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            margin-top: auto;
        }

        .footer span {
            background: linear-gradient(135deg, #3b82f6 0%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 20px;
            }
            
            .header {
                padding: 25px 20px;
            }
            
            .logo {
                font-size: 2rem;
            }
            
            .main-content {
                padding: 30px 20px;
            }
            
            .input-section {
                flex-direction: column;
            }
            
            .tracking-input {
                min-width: auto;
            }
            
            .track-btn {
                width: 100%;
            }
        }

        #tracking-widget {
            width: 100%;
            height: 100%;
            min-height: 500px;
            border-radius: 16px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">Smart Tracks</div>
            <div class="tagline">Professional Shipping Intelligence</div>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <input 
                    type="text" 
                    class="tracking-input" 
                    id="trackingNumber" 
                    placeholder="Enter BL/Container number (e.g., MAEU123456789, MSKU987654321...)"
                    maxlength="50"
                >
                <button class="track-btn" onclick="trackCargo()">Track Now</button>
            </div>
            
            <div class="results-container" id="resultsContainer">
                <div class="loading" id="loadingSpinner">Loading tracking information...</div>
                <div id="tracking-widget"></div>
            </div>
        </div>
        
        <div class="footer">
            Smart <span>Ali</span>
        </div>
    </div>

    <script>
        // Common carrier prefixes for auto-detection
        const carrierPrefixes = [
            'MAEU', 'MSKU', 'MEDU', 'CMDU', 'TLLU', 'HLXU', 'OOLU', 'SEGU', 
            'APZU', 'WHLC', 'TXGU', 'IPXU', 'EMCU', 'HASU', 'CSNU', 'DRYU',
            'YMLU', 'KL1U', 'KL2U', 'KL3U', 'KKTU', 'KMCU', 'KMTU', 'KSTU'
        ];

        function detectCarrierPrefix(trackingNumber) {
            const upper = trackingNumber.toUpperCase();
            for (const prefix of carrierPrefixes) {
                if (upper.startsWith(prefix)) {
                    return prefix;
                }
            }
            return null;
        }

        function validateTrackingNumber(num) {
            return num && num.trim().length >= 8 && num.trim().length <= 50 && /^[A-Z0-9]{8,50}$/i.test(num.trim());
        }

        function trackCargo() {
            const trackingInput = document.getElementById('trackingNumber');
            const resultsContainer = document.getElementById('resultsContainer');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const trackingWidget = document.getElementById('tracking-widget');
            
            const trackingNumber = trackingInput.value.trim();
            
            if (!validateTrackingNumber(trackingNumber)) {
                alert('Please enter a valid BL/Container number (8-50 alphanumeric characters)');
                trackingInput.focus();
                return;
            }
            
            // Show results container and loading
            resultsContainer.classList.add('show');
            loadingSpinner.style.display = 'block';
            trackingWidget.style.display = 'none';
            
            // Small delay to show loading animation
            setTimeout(() => {
                try {
                    // Load 17TRACK widget
                    YQV5.trackSingle({
                        nums: [trackingNumber],
                        callback: function(data) {
                            loadingSpinner.style.display = 'none';
                            trackingWidget.style.display = 'block';
                        },
                        lang: 'en',
                        height: '100%'
                    }, 'tracking-widget');
                } catch (error) {
                    loadingSpinner.textContent = 'Error loading tracking data. Please try again.';
                    console.error('Tracking error:', error);
                }
            }, 800);
        }

        // Allow Enter key to trigger tracking
        document.getElementById('trackingNumber').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                trackCargo();
            }
        });

        // Auto-format input (uppercase)
        document.getElementById('trackingNumber').addEventListener('input', function(e) {
            this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });

        // Add some example numbers as placeholder hint
        document.getElementById('trackingNumber').placeholder = 
            carrierPrefixes.slice(0, 3).map(p => `${p}123456789`).join(', ') + '...';
    </script>
</body>
</html>
